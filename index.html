<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق الملاحظات الاحترافي</title>
    <style>
        :root {
            --primary: #2563EB;
            --bg-main: #FFFFFF;
            --bg-sidebar: #F9FAFB;
            --bg-hover: #F3F4F6;
            --border: #E5E7EB;
            --text-dark: #111827;
            --text-light: #6B7280;
            --danger: #EF4444;
            --input-bg: #FFFFFF;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        [data-theme="dark"] {
            --primary: #3B82F6;
            --bg-main: #111827;
            --bg-sidebar: #1F2937;
            --bg-hover: #374151;
            --border: #374151;
            --text-dark: #F9FAFB;
            --text-light: #9CA3AF;
            --input-bg: #111827;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.5);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-dark);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        .sidebar {
            width: 250px;
            background-color: var(--bg-sidebar);
            border-left: 1px solid var(--border);
            padding: 20px;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: var(--primary);
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            gap: 10px;
            animation: fadeInDown 0.5s ease;
        }

        .theme-toggle {
            background: none;
            border: 1px solid var(--border);
            color: var(--text-dark);
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 20px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: transform 0.2s ease, background-color 0.2s ease;
        }

        .theme-toggle:hover {
            transform: scale(1.02);
            background-color: var(--bg-hover);
        }

        .menu-item {
            padding: 10px 15px;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 5px;
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--text-dark);
            font-weight: 500;
        }

        .menu-item:hover, .menu-item.active {
            background-color: var(--bg-hover);
            transform: translateX(-5px);
        }

        .menu-item.active {
            color: var(--primary);
            border-right: 4px solid var(--primary);
        }

        .tags-section {
            margin-top: 20px;
        }
        
        .tags-title {
            font-size: 14px;
            color: var(--text-light);
            margin-bottom: 10px;
            padding-right: 15px;
        }

        .notes-list-container {
            width: 350px;
            border-left: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            background-color: var(--bg-main);
        }

        .list-header {
            padding: 20px;
            border-bottom: 1px solid var(--border);
        }

        .create-btn {
            width: 100%;
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 15px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .create-btn:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow);
        }

        .create-btn:active {
            transform: translateY(0);
        }

        .search-bar {
            width: 100%;
            padding: 10px 15px;
            border: 1px solid var(--border);
            border-radius: 8px;
            outline: none;
            background-color: var(--input-bg);
            color: var(--text-dark);
        }
        
        .search-bar:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.2);
        }

        .notes-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }

        .note-card {
            padding: 15px;
            border: 1px solid transparent;
            border-bottom: 1px solid var(--border);
            cursor: pointer;
            border-radius: 8px;
            margin-bottom: 8px;
            animation: fadeInUp 0.4s ease forwards;
            opacity: 0;
            transform: translateY(10px);
        }

        .note-card:hover {
            background-color: var(--bg-hover);
            transform: translateY(-3px);
            border-color: var(--border);
            box-shadow: var(--shadow);
        }

        .note-card.active {
            background-color: var(--bg-hover);
            border-right: 4px solid var(--primary);
        }

        .note-card h3 {
            font-size: 16px;
            margin-bottom: 5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .note-tags {
            font-size: 12px;
            color: var(--primary);
            margin-bottom: 5px;
        }

        .note-date {
            font-size: 12px;
            color: var(--text-light);
        }

        .editor-container {
            flex: 1;
            padding: 40px;
            display: flex;
            flex-direction: column;
            background-color: var(--bg-main);
            overflow-y: auto;
        }

        .editor-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 20px;
            animation: fadeInDown 0.4s ease;
        }

        .editor-actions button {
            background: var(--bg-sidebar);
            color: var(--text-dark);
            border: 1px solid var(--border);
            padding: 8px 15px;
            border-radius: 6px;
            cursor: pointer;
            margin-right: 10px;
            font-weight: 500;
        }

        .editor-actions button:hover {
            background: var(--bg-hover);
            transform: scale(1.05);
        }
        
        .editor-actions button.delete-btn {
            color: var(--danger);
        }

        .title-input {
            font-size: 32px;
            font-weight: bold;
            border: none;
            outline: none;
            width: 100%;
            margin-bottom: 15px;
            color: var(--text-dark);
            background-color: transparent;
            animation: fadeIn 0.6s ease;
        }

        .tags-input {
            font-size: 14px;
            border: none;
            outline: none;
            width: 100%;
            margin-bottom: 20px;
            color: var(--text-light);
            background-color: transparent;
            padding-bottom: 10px;
            animation: fadeIn 0.7s ease;
        }

        .content-input {
            flex: 1;
            border: none;
            outline: none;
            resize: none;
            font-size: 16px;
            line-height: 1.6;
            color: var(--text-dark);
            background-color: transparent;
            animation: fadeIn 0.8s ease;
        }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--text-light);
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeInUp {
            to { opacity: 1; transform: translateY(0); }
        }
        
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @media (max-width: 900px) {
            .sidebar { display: none; }
            .notes-list-container { flex: 1; }
            .editor-container { display: none; position: absolute; top:0; right:0; width: 100%; height: 100%; z-index: 10; }
            .editor-container.active-mobile { display: flex; animation: slideIn 0.3s forwards; }
        }
        
        @keyframes slideIn {
            from { transform: translateX(-100%); }
            to { transform: translateX(0); }
        }
    </style>
</head>
<body>

    <aside class="sidebar">
        <div class="logo">📝 Notes App</div>
        
        <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()">
            🌙 الوضع الداكن
        </button>

        <div class="menu-item active" onclick="filterNotes('all')">📚 كل الملاحظات</div>
        <div class="menu-item" onclick="filterNotes('archived')">🗄️ الأرشيف</div>
        
        <div class="tags-section">
            <div class="tags-title">التصنيفات (Tags)</div>
            <div id="tagsList"></div>
        </div>
    </aside>

    <main class="notes-list-container">
        <div class="list-header">
            <button class="create-btn" onclick="createNewNote()">+ ملاحظة جديدة</button>
            <input type="text" class="search-bar" id="searchInput" placeholder="ابحث في الملاحظات..." onkeyup="searchNotes()">
        </div>
        <div class="notes-list" id="notesList"></div>
    </main>

    <section class="editor-container" id="editorContainer">
        <div class="empty-state" id="emptyState">
            <h2 style="margin-bottom: 10px;">✨ أهلاً بك في ملاحظاتك</h2>
            <p>اختر ملاحظة لعرضها أو قم بإنشاء واحدة جديدة</p>
        </div>
        
        <div id="editorContent" style="display: none; height: 100%; flex-direction: column;">
            <div class="editor-header">
                <div>
                    <button onclick="closeMobileEditor()" style="display: none; background: transparent; border: none; font-size: 20px;" id="backBtn">🔙</button>
                </div>
                <div class="editor-actions">
                    <button onclick="toggleArchive()" id="archiveBtn">أرشفة</button>
                    <button class="delete-btn" onclick="deleteNote()">حذف</button>
                    <button style="background: var(--primary); color: white; border: none;" onclick="saveNote(event)">حفظ التعديلات</button>
                </div>
            </div>
            
            <input type="text" class="title-input" id="noteTitle" placeholder="عنوان الملاحظة...">
            <input type="text" class="tags-input" id="noteTags" placeholder="التصنيفات (افصل بينها بفاصلة، مثال: React, Dev)...">
            <textarea class="content-input" id="noteContent" placeholder="ابدأ الكتابة هنا..."></textarea>
        </div>
    </section>

    <script>
        const themeToggleBtn = document.querySelector('#themeToggle');
        
        if (localStorage.getItem('theme') === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
            themeToggleBtn.innerHTML = '☀️ الوضع الفاتح';
        }

        function toggleTheme() {
            let currentTheme = document.documentElement.getAttribute('data-theme');
            if (currentTheme === 'dark') {
                document.documentElement.removeAttribute('data-theme');
                localStorage.setItem('theme', 'light');
                themeToggleBtn.innerHTML = '🌙 الوضع الداكن';
            } else {
                document.documentElement.setAttribute('data-theme', 'dark');
                localStorage.setItem('theme', 'dark');
                themeToggleBtn.innerHTML = '☀️ الوضع الفاتح';
            }
        }

        let notes = [];
        try {
            notes = JSON.parse(localStorage.getItem('notesApp_data')) || [];
        } catch(e) {
            notes = [];
        }
        
        let currentNoteId = null;
        let currentFilter = 'all';

        function renderNotes(searchTerm = '') {
            let listContainer = document.querySelector('#notesList');
            listContainer.innerHTML = '';

            let filteredNotes = notes;

            if (currentFilter === 'archived') {
                filteredNotes = notes.filter(n => n.archived);
            } else if (currentFilter === 'all') {
                filteredNotes = notes.filter(n => !n.archived);
            } else {
                filteredNotes = notes.filter(n => !n.archived && n.tags.includes(currentFilter));
            }

            if (searchTerm) {
                filteredNotes = filteredNotes.filter(n => 
                    n.title.toLowerCase().includes(searchTerm.toLowerCase()) || 
                    n.content.toLowerCase().includes(searchTerm.toLowerCase())
                );
            }

            filteredNotes.sort((a, b) => b.lastEdited - a.lastEdited);

            filteredNotes.forEach((note, index) => {
                let date = new Date(note.lastEdited).toLocaleDateString('ar-EG', { day: 'numeric', month: 'short', year: 'numeric' });
                let div = document.createElement('div');
                div.className = `note-card ${currentNoteId === note.id ? 'active' : ''}`;
                div.style.animationDelay = `${index * 0.05}s`;
                div.onclick = () => openNote(note.id);
                
                div.innerHTML = `
                    <h3>${note.title || 'ملاحظة بدون عنوان'}</h3>
                    <div class="note-tags">${note.tags.join(', ')}</div>
                    <div class="note-date">${date}</div>
                `;
                listContainer.appendChild(div);
            });

            renderTags();
        }

        function renderTags() {
            let tagsList = document.querySelector('#tagsList');
            tagsList.innerHTML = '';
            
            let allTags = new Set();
            notes.forEach(n => {
                if(!n.archived) n.tags.forEach(t => allTags.add(t.trim()));
            });

            allTags.forEach(tag => {
                if(!tag) return;
                let div = document.createElement('div');
                div.className = `menu-item ${currentFilter === tag ? 'active' : ''}`;
                div.innerHTML = `🏷️ ${tag}`;
                div.onclick = (e) => filterNotes(tag, e);
                tagsList.appendChild(div);
            });
        }

        function filterNotes(filterType, e) {
            currentFilter = filterType;
            document.querySelectorAll('.menu-item').forEach(el => el.classList.remove('active'));
            if(e) e.currentTarget.classList.add('active');
            renderNotes();
        }

        function searchNotes() {
            let val = document.querySelector('#searchInput').value;
            renderNotes(val);
        }

        function createNewNote() {
            let newNote = {
                id: Date.now().toString(),
                title: '',
                content: '',
                tags: [],
                archived: false,
                lastEdited: Date.now()
            };
            notes.unshift(newNote);
            openNote(newNote.id);
            saveToLocal();
        }

        function openNote(id) {
            currentNoteId = id;
            let note = notes.find(n => n.id === id);
            
            document.querySelector('#emptyState').style.display = 'none';
            document.querySelector('#editorContent').style.display = 'flex';
            
            document.querySelector('#noteTitle').value = note.title;
            document.querySelector('#noteContent').value = note.content;
            document.querySelector('#noteTags').value = note.tags.join(', ');
            
            document.querySelector('#archiveBtn').innerText = note.archived ? 'إلغاء الأرشفة' : 'أرشفة';

            if(window.innerWidth <= 900) {
                document.querySelector('#editorContainer').classList.add('active-mobile');
                document.querySelector('#backBtn').style.display = 'inline-block';
            }

            renderNotes();
        }

        // Auto Save Feature
        document.querySelector('#noteTitle').addEventListener('input', autoSave);
        document.querySelector('#noteTags').addEventListener('input', autoSave);
        document.querySelector('#noteContent').addEventListener('input', autoSave);

        function autoSave() {
            if(!currentNoteId) return;
            let noteIndex = notes.findIndex(n => n.id === currentNoteId);
            if(noteIndex > -1) {
                let tagsArray = document.querySelector('#noteTags').value.split(',').map(t => t.trim()).filter(t => t);
                notes[noteIndex].title = document.querySelector('#noteTitle').value;
                notes[noteIndex].content = document.querySelector('#noteContent').value;
                notes[noteIndex].tags = tagsArray;
                notes[noteIndex].lastEdited = Date.now();
                saveToLocal();
                
                let activeCardTitle = document.querySelector('.note-card.active h3');
                if(activeCardTitle) {
                    activeCardTitle.innerText = notes[noteIndex].title || 'ملاحظة بدون عنوان';
                }
                let activeCardTags = document.querySelector('.note-card.active .note-tags');
                if(activeCardTags) {
                    activeCardTags.innerText = notes[noteIndex].tags.join(', ');
                }
            }
        }

        function saveNote(e) {
            autoSave();
            let saveBtn = e.currentTarget;
            let originalText = saveBtn.innerText;
            saveBtn.innerText = '✅ تم الحفظ';
            saveBtn.style.backgroundColor = '#10B981';
            setTimeout(() => {
                saveBtn.innerText = originalText;
                saveBtn.style.backgroundColor = 'var(--primary)';
            }, 1500);
            renderNotes();
        }

        function deleteNote() {
            if(confirm('متأكد إنك عايز تحذف الملاحظة دي؟')) {
                notes = notes.filter(n => n.id !== currentNoteId);
                currentNoteId = null;
                
                document.querySelector('#emptyState').style.display = 'flex';
                document.querySelector('#editorContent').style.display = 'none';
                
                saveToLocal();
                renderNotes();
                closeMobileEditor();
            }
        }

        function toggleArchive() {
            let noteIndex = notes.findIndex(n => n.id === currentNoteId);
            notes[noteIndex].archived = !notes[noteIndex].archived;
            saveToLocal();
            
            document.querySelector('#emptyState').style.display = 'flex';
            document.querySelector('#editorContent').style.display = 'none';
            
            renderNotes();
            closeMobileEditor();
        }

        function saveToLocal() {
            localStorage.setItem('notesApp_data', JSON.stringify(notes));
        }

        function closeMobileEditor() {
            document.querySelector('#editorContainer').classList.remove('active-mobile');
        }

        renderNotes();
    </script>
</body>
</html>
